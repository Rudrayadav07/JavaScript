<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GitProfile</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
</head>

<body class="bg-[#090b0d] text-[#f2f2f0] font-sans antialiased">

  <main class="min-h-screen">

    <!-- HEADER -->
    <header class="border-b border-[#1c2025]">

      <div
        class="max-w-6xl mx-auto
               h-16
               px-5 sm:px-8
               flex items-center justify-between"
      >

        <div class="flex items-center gap-3">

          <div
            class="w-8 h-8
                   rounded-md
                   bg-white
                   text-black
                   flex items-center justify-center
                   text-xs
                   font-semibold"
          >
            G
          </div>

          <span class="text-sm font-medium">
            GitProfile
          </span>

        </div>

        <span
          class="hidden sm:block
                 text-[10px]
                 uppercase
                 tracking-[0.16em]
                 text-[#555c64]"
        >
          GitHub Explorer
        </span>

      </div>

    </header>


   <!-- SEARCH -->
<section class="border-b border-[#1c2025]">

  <div
    class="max-w-6xl mx-auto
           px-5 sm:px-8
           py-5"
  >

    <div
      class="max-w-xl
             flex items-center
             h-12
             rounded-lg
             border border-[#292e34]
             bg-[#0e1114]"
    >

      <span
        class="hidden sm:block
               pl-4
               text-xs
               text-[#555c64]"
      >
        github.com/
      </span>

      <input
        type="text"
        value="octocat"
        placeholder="username"
        class="inp flex-1
               min-w-0
               h-full
               px-4 sm:px-2
               bg-transparent
               outline-none
               text-sm
               text-white
               placeholder:text-[#4e555d]"
      />

      <button
        class="btn mr-1
               h-10
               px-5
               rounded-md
               bg-white
               text-black
               text-xs
               font-medium
               hover:bg-gray-200
               transition"
      >
        Search
      </button>

    </div>

  </div>

</section>


<!-- PROFILE WILL BE INSERTED HERE -->
<div id="profile"></div>


<!-- FOOTER -->
<footer
  class="max-w-6xl mx-auto
         mt-12
         px-5 sm:px-8
         pt-5
         pb-5
         border-t border-[#1c2025]"
>

  <span
    class="text-[10px]
           uppercase
           tracking-[0.15em]
           text-[#484e55]"
  >
    GitProfile · Demo
  </span>

</footer>
      </div>

    </section>

  </main>
<script src="script.js"></script>
</body>
</html>
